[project]
name = "notetaker-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits real cloud endpoints, run with -m live"]
addopts = "-m 'not live'"
